id: org.freedesktop.Platform.GL.ps4
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: /bin/true
build-options:
  prefix: /usr
  strip: false
  no-debuginfo: true
  env:
    # keep the build lean
    CFLAGS: "-O2"
    CXXFLAGS: "-O2"
modules:
  - name: python3-pyyaml
    buildsystem: simple
    build-commands:
      - echo "FLATPAK_DEST=$FLATPAK_DEST"
      - mkdir -p "$FLATPAK_DEST/pylib"
      - python3 -m pip install --no-deps --no-build-isolation --target "$FLATPAK_DEST/pylib" .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
  - name: libdrm
    buildsystem: meson
    config-opts:
      - -Damdgpu=enabled
      - -Dradeon=enabled
      - -Dintel=enabled
      - -Dnouveau=enabled
      - -Dvmwgfx=disabled
      - -Dtests=false
      - -Dman-pages=disabled
      - -Dvalgrind=disabled
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/drm.git
        tag: libdrm-2.4.134
        commit: e984d448b8b17aab853369e6c203e53719f46de1
  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info.git
        tag: 0.2.0
        commit: 66b802d05b374cd8f388dc6ad1e7ae4f08cb3300
  - name: mesa-ps4
    buildsystem: meson
    build-options:
      env:
        PYTHONPATH: "/app/pylib"
        PKG_CONFIG_PATH: "/app/usr/lib64/pkgconfig:/app/usr/lib/x86_64-linux-gnu/pkgconfig:/app/usr/lib/pkgconfig:/app/usr/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
    config-opts:
      - -Dgallium-drivers=radeonsi,llvmpipe,softpipe
      - -Dvulkan-drivers=amd
      - -Dplatforms=wayland,x11
      - -Dllvm=enabled
      - -Dshared-llvm=enabled
      - -Dglx=dri
      - -Dgbm=enabled
      - -Degl=enabled
      - -Dbuildtype=release
      - -Dstrip=true
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/mesa.git
        tag: mesa-26.2.2
        commit: 997191be71afdb2234fa6a7275bfb8475c22250f
      - type: patch
        path: ps4-mesa.patch
