id: org.freedesktop.Platform.GL.ps4
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: /bin/true
build-options:
  prefix: /usr
  strip: false
  no-debuginfo: true
  env:
    # keep the build lean
    CFLAGS: "-O2"
    CXXFLAGS: "-O2"
modules:
  - name: mesa-ps4
    buildsystem: meson
    config-opts:
      - -Dgallium-drivers=radeonsi,llvmpipe,softpipe
      - -Dvulkan-drivers=amd
      - -Dplatforms=wayland,x11
      - -Dllvm=enabled
      - -Dshared-llvm=enabled
      - -Dglx=dri
      - -Dgbm=enabled
      - -Degl=enabled
      - -Dgallium-va=disabled
      - -Dgallium-vdpau=disabled
      - -Dgallium-xa=disabled
      - -Dbuildtype=release
      - -Dstrip=true
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/mesa.git
        tag: mesa-26.2.2
        commit: 997191be71afdb2234fa6a7275bfb8475c22250f
      - type: patch
        path: ps4-mesa.patch
