name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ================== CHEAP PREFLIGHT (no SDK needed) ==================
      - name: "PREFLIGHT 1 - manifest sanity"
        run: |
          set -e
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML not on runner; using ruby to validate YAML")
              sys.exit(0)
          d = yaml.safe_load(open("org.freedesktop.Platform.GL.ps4.yml"))
          print("manifest id:", d["id"], "modules:", [m["name"] for m in d["modules"]])
          PY

      - name: "PREFLIGHT 2 - clone Mesa + deps + verify/apply ps4-mesa.patch (host, has network)"
        run: |
          set -e
          rm -rf preflight && mkdir -p preflight
          git clone --depth 1 --branch mesa-26.2.2 https://gitlab.freedesktop.org/mesa/mesa.git preflight/mesa
          git clone --depth 1 --branch libdrm-2.4.134 https://gitlab.freedesktop.org/mesa/drm.git preflight/drm
          git clone --depth 1 --branch 0.2.0 https://gitlab.freedesktop.org/emersion/libdisplay-info.git preflight/libdisplay-info
          cd preflight/mesa
          echo "--- git apply --check ---"
          git apply --check --verbose "$GITHUB_WORKSPACE/ps4-mesa.patch"
          echo "--- applying ---"
          git apply --verbose "$GITHUB_WORKSPACE/ps4-mesa.patch"
          echo "OK: ps4-mesa.patch applies to mesa-26.2.2"

      - name: "PREFLIGHT 3 - fetch PyYAML sdist (host, has network)"
        run: |
          set -e
          cd preflight
          curl -fsSLO https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
          tar xf pyyaml-6.0.3.tar.gz
          ls -d pyyaml-6.0.3 mesa

      # ===================== RUN TIMES / SDK (cached) =====================
      - name: Restore Flathub runtimes + SDK cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-25.08-${{ runner.os }}
          restore-keys: |
            flatpak-runtimes-25.08-

      - name: Restore apt lists cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-lists
          key: apt-lists-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            apt-lists-${{ runner.os }}-

      - name: Install flatpak + flatpak-builder + ccache (apt caches reused)
        run: |
          if [ -d "$HOME/apt-lists" ]; then
            sudo mkdir -p /var/lib/apt/lists
            sudo cp -a "$HOME/apt-lists/." /var/lib/apt/lists/ 2>/dev/null || true
            echo "restored apt lists from cache"
          fi
          if ! command -v flatpak-builder >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y flatpak flatpak-builder ccache
          else
            echo "flatpak-builder already present - skipping apt"
          fi
          flatpak --version
          flatpak-builder --version
          ccache --version | head -1
          rm -rf "$HOME/apt-lists" && mkdir -p "$HOME/apt-lists"
          sudo cp -a /var/lib/apt/lists/. "$HOME/apt-lists/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-lists" 2>/dev/null || true
          sudo rm -f "$HOME/apt-lists/lock" 2>/dev/null || true
          rm -rf "$HOME/apt-lists/partial" 2>/dev/null || true
          echo "apt lists staged for cache:"; ls -la "$HOME/apt-lists" | head

      - name: Add Flathub and install SDK/Platform 25.08
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          echo "--- installed runtimes ---"
          flatpak list --user --runtime --columns=application,branch,size

      # ================== SDK-DEPENDENT PREFLIGHT ==================
      - name: "PREFLIGHT 4 - SDK dependency report"
        run: |
          flatpak run --user --command=sh org.freedesktop.Sdk//25.08 -c '
            echo "=========== tools ==========="
            for t in cc gcc g++ meson ninja python3 pkg-config glslangValidator wayland-scanner; do
              if command -v "$t" >/dev/null 2>&1; then printf "  ok      %s\n" "$t"; else printf "  MISSING %s\n" "$t"; fi
            done
            echo "=========== python ==========="
            python3 --version
            for m in setuptools mako packaging; do
              if python3 -c "import $m" >/dev/null 2>&1; then printf "  ok      %s\n" "$m"; else printf "  MISSING %s\n" "$m"; fi
            done
            echo "=========== pkg-config ==========="
            for p in libdrm libglvnd wayland-client x11 xcb xrandr xshmfence xcb-dri3 zlib zstd expat libelf libunwind; do
              if pkg-config --exists "$p"; then printf "  ok      %s\n" "$p"; else printf "  MISSING %s\n" "$p"; fi
            done
            echo "=========== meson ==========="; meson --version
            echo "=========== pkg-config search path ==========="
            echo "pc_path: $(pkg-config --variable pc_path pkg-config)"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "=========== where are the deps? ==========="
            for f in libdrm.pc libdrm_amdgpu.pc libdisplay-info.pc libLLVM.pc; do
              echo "--- $f ---"; find /usr -name "$f" 2>/dev/null || echo "  (not found)"
            done
            echo "--- sample of pkgconfig dir ---"
            ls /usr/lib/x86_64-linux-gnu/pkgconfig 2>/dev/null | head -40
            ls /usr/lib/pkgconfig 2>/dev/null | head -40
          '

      - name: "PREFLIGHT 5 - build deps + configure Mesa (no compile; flatpak-builder compiles once)"
        run: |
          set -e
          export PF="$GITHUB_WORKSPACE/preflight"
          flatpak run --user --filesystem="$PF" --env=PF="$PF" --command=sh org.freedesktop.Sdk//25.08 -c '
            set -e
            export PREFIX=/tmp/deps
            echo "===== libdrm (amdgpu) ====="
            cd "$PF/drm"
            meson setup /tmp/drm-build --prefix="$PREFIX" \
              -Damdgpu=enabled -Dradeon=enabled -Dintel=enabled -Dnouveau=enabled \
              -Dvmwgfx=disabled -Dtests=false -Dman-pages=disabled
            ninja -C /tmp/drm-build install
            echo "===== libdisplay-info ====="
            cd "$PF/libdisplay-info"
            meson setup /tmp/ldi-build --prefix="$PREFIX"
            ninja -C /tmp/ldi-build install
            export PKG_CONFIG_PATH="$PREFIX/lib64/pkgconfig:$PREFIX/lib/x86_64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            pkg-config --modversion libdrm_amdgpu || echo "libdrm_amdgpu still not found"
            pkg-config --modversion libdisplay-info || echo "libdisplay-info still not found"
            echo "--- llvm availability ---"
            command -v llvm-config || echo "no llvm-config"
            pkg-config --modversion llvm 2>/dev/null || echo "no llvm.pc"
            echo "===== PyYAML ====="
            python3 -m pip install --quiet --no-deps --no-build-isolation --target /tmp/pylib "$PF/pyyaml-6.0.3"
            export PYTHONPATH=/tmp/pylib
            echo "===== Mesa configure (vulkan/RADV, no LLVM) ====="
            cd "$PF/mesa"
            meson setup /tmp/mesa-build --prefix=/usr . \
              -Dgallium-drivers=zink \
              -Dvulkan-drivers=amd -Dplatforms=wayland,x11 \
              -Dllvm=disabled -Dglx=dri -Dgbm=enabled -Degl=enabled \
              -Dbuildtype=release -Dstrip=true
            echo "OK: deps + Mesa configure succeeded (flatpak-builder does the single compile)"
          '

      # ============================ BUILD ============================
      - name: Restore flatpak-builder state
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ github.ref_name }}-${{ hashFiles('org.freedesktop.Platform.GL.ps4.yml','ps4-mesa.patch') }}
          restore-keys: |
            flatpak-builder-${{ github.ref_name }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build Mesa (patched for PS4/Liverpool)
        run: |
          flatpak-builder --user --ccache --force-clean --repo=repo build org.freedesktop.Platform.GL.ps4.yml

      - name: Show produced layout
        run: |
          echo "=== build/files tree (depth 4) ==="
          find build/files -maxdepth 4 | sort | head -120

      - name: Package install tree
        run: |
          tar -C build/files -czf mesa-ps4-flatpak.tar.gz .
          ls -lh mesa-ps4-flatpak.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ps4-flatpak
          path: mesa-ps4-flatpak.tar.gz
          retention-days: 30

      # ------------------------------------------------ cache save (always)
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save flatpak-builder state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ github.ref_name }}-${{ hashFiles('org.freedesktop.Platform.GL.ps4.yml','ps4-mesa.patch') }}-${{ github.run_id }}

      - name: Save Flathub runtimes + SDK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-25.08-${{ runner.os }}-${{ github.run_id }}

      - name: Save apt lists
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/apt-lists
          key: apt-lists-${{ runner.os }}-${{ github.run_id }}
